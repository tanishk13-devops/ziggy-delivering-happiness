<header class="topbar glass-panel">
	<div class="brand" routerLink="/home"><span class="red-text">Ziggy</span><span class="gold-gradient-text" *ngIf="isGoldMember()"> GOLD</span></div>

	<nav class="nav-links">
		<a routerLink="/home" routerLinkActive="active">Home</a>
		<a routerLink="/restaurants" routerLinkActive="active">Restaurants</a>
		<a routerLink="/cart" routerLinkActive="active" class="cart-link" [class.bump]="cartBump" *ngIf="authService.isLoggedIn()">
			<span>Cart</span>
			<span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
		</a>
		<a routerLink="/checkout" routerLinkActive="active" *ngIf="authService.isLoggedIn()">Checkout</a>
		<a routerLink="/orders" routerLinkActive="active" *ngIf="authService.isLoggedIn()">Orders</a>
		<a routerLink="/order-tracking" routerLinkActive="active" *ngIf="authService.isLoggedIn()">Tracking</a>
		<a routerLink="/admin" routerLinkActive="active" *ngIf="authService.isLoggedIn() && authService.getCurrentUser()?.role === 'Admin'">Admin Panel</a>
	</nav>

	<div class="auth-actions" *ngIf="!authService.isLoggedIn(); else loggedInBlock">
		<a routerLink="/login" class="btn btn-secondary">Login</a>
		<a routerLink="/register" class="btn btn-primary">Sign Up</a>
	</div>

	<ng-template #loggedInBlock>
		<div class="user-block">
			<span class="welcome">Hi, {{ authService.getCurrentUser()?.name }}</span>
			<span class="badge-gold" *ngIf="isGoldMember()">🏅 Gold</span>
			<button class="btn btn-secondary" (click)="logout()">Logout</button>
		</div>
	</ng-template>
</header>

<main class="page-wrap">
	<div class="route-shell" [@routeTransition]="routeState">
		<router-outlet #outlet="outlet"></router-outlet>
	</div>
</main>

<app-premium-footer></app-premium-footer>
