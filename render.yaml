services:
  - type: web
    name: ziggy-app
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: EnableSwagger
        value: "true"
      - key: UseInMemoryDatabase
        value: "true"
      - key: DATABASE_URL
        value: ""
      - key: Jwt__Key
        value: "SelectAStrongKeyForYourJwtTokensAtLeast32CharsLong!"
      - key: Jwt__Issuer
        value: FoodDeliveryAPI
      - key: Jwt__Audience
        value: FoodDeliveryAPI.Client
